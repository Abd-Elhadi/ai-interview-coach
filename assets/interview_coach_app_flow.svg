<svg xmlns="http://www.w3.org/2000/svg" width="900" height="944" viewBox="0 0 900 944" role="img" font-family="Arial, Helvetica, sans-serif">
<title>AI Interview Coach app flow</title><desc>Sign in, input guardrails, planning crew, spoken question, recorded answer with edited transcript, evaluation crew, report crew with approval, then save, PDF and email. Quiz and coding tabs, MCP server, SQLite, Resend and OpenAI shown alongside.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="900" height="944" fill="#FFFFFF"/>
<text x="110" y="26" font-size="18" font-weight="bold" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">AI Interview Coach: app flow</text>
<rect x="110" y="52" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
<text x="130" y="59" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">Agent crew</text>
<rect x="260" y="52" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text x="280" y="59" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">MCP tool</text>
<rect x="410" y="52" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/>
<text x="430" y="59" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">Human step</text>
<rect x="560" y="52" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="580" y="59" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">Python checks</text>
<rect x="710" y="52" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="730" y="59" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">Storage, services</text>
<line x1="110" y1="84" x2="140" y2="84" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="148" y="84" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">Dashed arrow: called in process by the UI, not by an agent over stdio</text>
<rect x="110" y="112" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="255.0" y="131.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">1. Sign in or sign up</text>
<text x="255.0" y="151.0" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">scrypt hash, lockout after 5 tries</text>
<rect x="110" y="190" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="255.0" y="209.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">2. Resume and job post</text>
<text x="255.0" y="229.0" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">size limit, redact PII, drop injections</text>
<rect x="110" y="268" width="290" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="255.0" y="287.0" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">3. Planning crew</text>
<text x="255.0" y="307.0" font-size="12" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">job, resume, planner agents (MCP)</text>
<rect x="110" y="346" width="290" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="255.0" y="365.0" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle" dominant-baseline="central">4. Question spoken</text>
<text x="255.0" y="385.0" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="middle" dominant-baseline="central">text to speech, one question at a time</text>
<rect x="110" y="424" width="290" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="255.0" y="443.0" font-size="14" font-weight="bold" fill="#633806" text-anchor="middle" dominant-baseline="central">5. Record, transcribe, edit</text>
<text x="255.0" y="463.0" font-size="12" font-weight="normal" fill="#854F0B" text-anchor="middle" dominant-baseline="central">you confirm the transcript</text>
<rect x="110" y="502" width="290" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="255.0" y="521.0" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">6. Evaluation crew</text>
<text x="255.0" y="541.0" font-size="12" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">rubric score, improved answer, memory</text>
<rect x="110" y="580" width="290" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="255.0" y="599.0" font-size="14" font-weight="bold" fill="#633806" text-anchor="middle" dominant-baseline="central">7. Report crew, your approval</text>
<text x="255.0" y="619.0" font-size="12" font-weight="normal" fill="#854F0B" text-anchor="middle" dominant-baseline="central">edit, approve, or reject the draft</text>
<rect x="110" y="658" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="255.0" y="677.0" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">8. Save and share</text>
<text x="255.0" y="697.0" font-size="12" font-weight="normal" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">SQLite, PDF, email, My reports</text>
<line x1="255.0" y1="169" x2="255.0" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="255.0" y1="247" x2="255.0" y2="266" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="255.0" y1="325" x2="255.0" y2="344" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="255.0" y1="403" x2="255.0" y2="422" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="255.0" y1="481" x2="255.0" y2="500" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="255.0" y1="559" x2="255.0" y2="578" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="255.0" y1="637" x2="255.0" y2="656" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M110 530 L88 530 L88 374 L107 374" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#a)"/>
<text x="82" y="452" font-size="12" font-weight="normal" fill="#444441" text-anchor="end" dominant-baseline="central">next question</text>
<rect x="470" y="112" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="670.0" y="131.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">SQLite</text>
<text x="670.0" y="151.0" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">users, reports, seen question ids</text>
<rect x="470" y="268" width="400" height="290" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="670.0" y="290" font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Custom MCP server (stdio)</text>
<text x="490" y="322" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start" dominant-baseline="central">get_interview_questions: random sample, skips seen ids</text>
<text x="490" y="350" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start" dominant-baseline="central">get_scoring_rubric, get_delivery_guidelines</text>
<text x="490" y="378" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start" dominant-baseline="central">synthesize_question, transcribe_answer</text>
<text x="490" y="406" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start" dominant-baseline="central">read_resume (restricted folder)</text>
<text x="490" y="434" font-size="12" font-weight="normal" fill="#534AB7" text-anchor="start" dominant-baseline="central">get_coding_problem, get_test_cases</text>
<text x="490" y="472" font-size="12" font-weight="normal" fill="#444441" text-anchor="start" dominant-baseline="central">Agents use it over stdio. The UI runs speech tools in process.</text>
<rect x="470" y="658" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="670.0" y="677.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">Resend</text>
<text x="670.0" y="697.0" font-size="12" font-weight="normal" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">PDF to your account email, 3 per hour</text>
<line x1="401" y1="140" x2="468" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="401" y1="296" x2="468" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="401" y1="374" x2="468" y2="374" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="401" y1="452" x2="468" y2="452" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="401" y1="530" x2="468" y2="530" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="401" y1="686" x2="468" y2="686" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="100" y="744" width="780" height="112" rx="12" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4"/>
<text x="116" y="762" font-size="13" font-weight="bold" fill="#444441" text-anchor="start" dominant-baseline="central">Other tabs (need a signed-in session)</text>
<rect x="110" y="780" width="290" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="255.0" y="799.0" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Quiz tab</text>
<text x="255.0" y="819.0" font-size="12" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">MCQ crew, scored in Python</text>
<rect x="470" y="780" width="400" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="670.0" y="799.0" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Coding tab</text>
<text x="670.0" y="819.0" font-size="12" font-weight="normal" fill="#185FA5" text-anchor="middle" dominant-baseline="central">random problem, sandbox tests, code review crew</text>
<rect x="110" y="880" width="760" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="490.0" y="902.0" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle" dominant-baseline="central">OpenAI API: agents, transcription, speech</text>
</svg>